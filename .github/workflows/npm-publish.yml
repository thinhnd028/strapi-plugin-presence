# Publish to GitHub Packages on release. Triggered when a GitHub Release is created
# with a tag like `v0.0.6` — the workflow syncs package.json version to the tag, builds,
# then publishes to https://npm.pkg.github.com under the @thinhnd028 scope.

name: Publish to GitHub Packages

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@thinhnd028'
      - run: npm ci
      - name: Sync package.json version with release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Setting package.json version to $TAG"
          npm version "$TAG" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
